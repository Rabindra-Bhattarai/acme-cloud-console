{% extends "base.html" %}
{% block content %}
  <div class="card">
    <h1>My notes</h1>
    <p class="sub">A private scratchpad saved to your account.</p>
    {% if saved %}<p class="ok">Notes saved.</p>{% endif %}
    <form method="post">
      <label for="n">Note</label>
      <textarea id="n" name="note" rows="5" style="width:100%">{{ u["note"] or "" }}</textarea>
      <button type="submit">Save</button>
    </form>
  </div>
{% endblock %}
