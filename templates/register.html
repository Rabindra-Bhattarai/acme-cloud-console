{% extends "base.html" %}
{% block content %}
  <div class="card" style="max-width:420px; margin:3rem auto;">
    <h1>Create account</h1>
    <p class="sub">You'll start on the <strong>user</strong> tier.</p>
    <form method="post">
      <label for="u">Username</label>
      <input id="u" name="username" autofocus autocomplete="off">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="off">
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
      <button type="submit">Create account</button>
    </form>
    <p class="muted" style="margin-top:1rem">Already have one? <a href="/login">Sign in</a></p>
  </div>
{% endblock %}
