{% extends "base.html" %}
{% block content %}
  <div class="card" style="max-width:420px; margin:3rem auto;">
    <h1>Sign in</h1>
    <p class="sub">Use your Acme account.</p>
    <form method="post">
      <label for="u">Username</label>
      <input id="u" name="username" autofocus autocomplete="off">
      <label for="p">Password</label>
      <input id="p" name="password" type="password" autocomplete="off">
      {% if error %}<p class="err">{{ error }}</p>{% endif %}
      <button type="submit">Sign in</button>
    </form>
    <p class="muted" style="margin-top:1rem">No account? <a href="/register">Register</a>
       &middot; <a href="/admin/recover">Admin recovery</a></p>
  </div>
{% endblock %}
